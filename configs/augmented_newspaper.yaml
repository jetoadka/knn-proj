# E2: Augmented Newspaper
# Train face recognition on WebFace4M + CUT-generated newspaper-style data
# This is the main experiment testing whether style-transfer augmentation helps

train-dir: data/downstream/E2_augmented/train
val-dir: data/people_gator/aligned_112/dev

backbone: convnext_atto
loss: cosface
embedding-dim: 512

epochs: 30
batch-size: 64
lr: 0.0001
weight-decay: 0.01
num-workers: 4

run-name: E2-augmented-newspaper
eval-interval: 5
save-dir: checkpoints
